name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 原生引擎：NDK 交叉编译皮卡鱼（真多线程，不依赖 COOP/SharedArrayBuffer） ----
      - name: Cache NDK r25c
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r25c
          key: android-ndk-r25c

      - name: Install NDK r25c
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          rm -f /tmp/ndk.zip

      - name: Set up NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25c" >> "$GITHUB_ENV"
          echo "$HOME/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build native Pikafish engine (JNI .so)
        run: |
          set -e
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git /tmp/pikafish
          cp "$GITHUB_WORKSPACE/app/src/main/cpp/wrapper.cpp" /tmp/pikafish/src/wrapper.cpp
          cd /tmp/pikafish/src
          # 1) 下载与源码匹配的 pikafish.nnue 网络（make net 调用官方 net.sh）
          make net
          ls -la pikafish.nnue
          # 2) 手动编译（flags 与官方 Makefile 的 armv8 对齐，-fPIC 且不带 LTO，
          #    产出普通 PIC 机器码目标文件，链接 .so 无 LTO 问题）
          CXX=aarch64-linux-android29-clang++
          NDKINC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          BASE="-O3 -std=c++17 -fPIC -DNDEBUG -DUSE_POPCNT -DUSE_NEON=8 -DIS_64BIT -DUSE_PREFETCH -DARCH=armv8-dotprod -Wall -Wcast-qual -fno-exceptions -pthread"
          ARCHFLAGS="-march=armv8.2-a+dotprod -DUSE_NEON_DOTPROD"
          rm -rf /tmp/obj && mkdir -p /tmp/obj
          ok=1
          for src in $(find . -name '*.cpp' -not -path './universal/*' -not -path './temp_builds/*'); do
            name=$(echo "$src" | tr '/' '_')
            if ! $CXX -c $BASE $ARCHFLAGS -I"$(pwd)" "$src" -o "/tmp/obj/${name}.o" 2>/tmp/err.log; then
              ok=0
              echo "compile failed: $(tail -1 /tmp/err.log)"
              break
            fi
          done
          if [ "$ok" = "0" ]; then
            echo "dotprod compile failed, retry armv8"
            ARCHFLAGS=""
            rm -f /tmp/obj/*.o
            for src in $(find . -name '*.cpp' -not -path './universal/*' -not -path './temp_builds/*'); do
              name=$(echo "$src" | tr '/' '_')
              $CXX -c $BASE $ARCHFLAGS -I"$(pwd)" "$src" -o "/tmp/obj/${name}.o"
            done
          fi
          # wrapper（需要 jni.h 搜索路径）
          $CXX -c $BASE $ARCHFLAGS -I"$(pwd)" -I"$NDKINC" wrapper.cpp -o /tmp/obj/wrapper.o
          # 3) 链接 .so（排除 main.o 的可执行入口；libc++ 静态链入）
          OBJS=$(ls /tmp/obj/*.o | grep -v '/main\.o' | tr '\n' ' ')
          [ -n "$OBJS" ] || { echo "::error::no objects to link"; exit 1; }
          $CXX -shared $OBJS -o libpikafishjni.so -static-libstdc++ -pthread
          # 4) 校验 JNI 导出符号存在（缺失会导致 UnsatisfiedLinkError）
          echo "=== JNI symbols before strip ==="
          llvm-nm -D libpikafishjni.so | grep 'Java_com_xiangqiai' || echo "NO JNI SYMBOLS"
          # 用 --strip-unneeded：只删未使用符号，保留动态导出符号（默认 strip-all 有删导出风险）
          llvm-strip --strip-unneeded libpikafishjni.so
          echo "=== JNI symbols after strip ==="
          llvm-nm -D libpikafishjni.so | grep 'Java_com_xiangqiai' || echo "NO JNI SYMBOLS AFTER STRIP"
          echo "=== .so info ==="
          file libpikafishjni.so
          ls -la libpikafishjni.so
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" \
                   "$GITHUB_WORKSPACE/app/src/main/assets/native"
          cp libpikafishjni.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          cp pikafish.nnue "$GITHUB_WORKSPACE/app/src/main/assets/native/pikafish.nnue"
          echo "native .so size: $(du -h "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpikafishjni.so" | cut -f1)"
          llvm-strip libpikafishjni.so
          echo "=== .so info ==="
          file libpikafishjni.so
          ls -la libpikafishjni.so
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" \
                   "$GITHUB_WORKSPACE/app/src/main/assets/native"
          cp libpikafishjni.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          cp pikafish.nnue "$GITHUB_WORKSPACE/app/src/main/assets/native/pikafish.nnue"
          echo "native .so size: $(du -h "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpikafishjni.so" | cut -f1)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # AGP 8.1.4 不兼容 Gradle 9.x，锁定 8.5
          gradle-version: '8.5'

      - name: Build APK (debug, auto-signed)
        run: |
          cd "$GITHUB_WORKSPACE"
          # 自动定位包含 settings.gradle 的工程目录（兼容工程在仓库根目录或嵌套在子目录）
          DIR=$(find . -maxdepth 3 -name settings.gradle -printf '%h\n' | head -1)
          if [ -z "$DIR" ]; then
            echo "::error::未找到 settings.gradle，请检查工程是否已上传"
            exit 1
          fi
          echo "工程目录: $DIR"
          cd "$DIR"
          # debug 版 APK 由构建系统自动签名，保证可直接安装
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiangqiai-apk
          path: |
            **/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
