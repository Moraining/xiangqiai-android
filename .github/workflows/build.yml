name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: |
          cd "$GITHUB_WORKSPACE"
          DIR=$(find . -maxdepth 3 -name settings.gradle -printf '%h\n' | head -1)
          if [ -z "$DIR" ]; then
            echo "::error::未找到 settings.gradle，请检查工程是否已上传"
            exit 1
          fi
          echo "工程目录: $DIR"
          cd "$DIR"
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiangqiai-apk
          path: |
            **/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
